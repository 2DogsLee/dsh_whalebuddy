  /* 整窗透明：窗口本体由 tauri.conf.json transparent:true 打通 */
  /* 皮肤扩展点：html[data-skin='<skin-id>'] 覆盖 --dsh-whale 等变量即可换肤。
     whalebuddy 设置菜单的 skin 字段推送 data-skin（applyConfig）。
     默认皮肤 dsh-black-whale 即 :root 当前鲸鱼；新增皮肤在此加一组覆盖。 */
  html[data-skin='dsh-black-whale'] { /* 默认黑鲸皮肤，变量即 :root，无需覆盖 */ }
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }
  body.expanded { overflow: visible; }

  .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    position: relative;
    padding: 14px;
    background: rgba(255, 255, 255, 0.01); /* 几乎透明但强制 WebView 接收鼠标（透明穿透绕过） */
    pointer-events: auto;
  }

  /* ============ ①+②+③+④ 舷窗（四层渲染） ============ */
  .pet {
    position: relative;
    width: 150px;
    height: 150px;
    cursor: grab;
  }
  .pet:active { cursor: grabbing; }

  /* ④ 视口裁剪 + ② 场景层 */
  .viewport {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.5);
  }
  .scene {
    position: absolute;
    inset: 0;
    background-color: #0a3d5e;
    transition: background-color 1s ease;
    overflow: hidden;
  }
  /* 顶部光晕（可过渡，渐变底色不可插值所以不用渐变） */
  .scene::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% -12%, rgba(140, 210, 255, 0.22), transparent 58%);
    opacity: 0.35;
    transition: opacity 1s;
    pointer-events: none;
  }
  /* 恒定暗角（盖在道具之上，加深"透过玻璃"感） */
  .scene::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 34%, rgba(2, 8, 14, 0.5) 74%, rgba(1, 4, 8, 0.85) 100%);
    pointer-events: none;
  }

  /* —— 场景底色：activity 规则在前，state 规则在后（后者覆盖前者） —— */
  .scene { background-color: #0a3d5e; }
  [data-activity="coding"]   .scene { background-color: #0f4e75; }
  [data-activity="cmd"]      .scene { background-color: #0b3a58; }
  [data-activity="search"]   .scene { background-color: #0e4c6e; }
  [data-activity="spawning"] .scene { background-color: #0d4a70; }
  [data-state="offline"]     .scene { background-color: #05131d; }
  [data-state="sleeping"]    .scene { background-color: #07232f; }
  [data-state="needYou"]     .scene { background-color: #0b4a68; }
  [data-state="panic"]       .scene { background-color: #2b1318; }
  [data-state="celebrating"] .scene { background-color: #0c3d57; }

  /* —— 顶部光晕强度 —— */
  [data-state="offline"]     .scene::before { opacity: 0.08; }
  [data-state="sleeping"]    .scene::before { opacity: 0.2; }
  [data-state="needYou"]     .scene::before { opacity: 0.55; }
  [data-state="panic"]       .scene::before {
    background: radial-gradient(ellipse at 50% -12%, rgba(255, 90, 70, 0.20), transparent 58%);
    opacity: 0.3;
  }
  [data-state="celebrating"] .scene::before { opacity: 0.5; }
  [data-activity="coding"]   .scene::before { opacity: 0.5; }
  [data-activity="cmd"]      .scene::before { opacity: 0.38; }
  [data-activity="search"]   .scene::before { opacity: 0.45; }
  [data-activity="spawning"] .scene::before { opacity: 0.42; }

  /* —— 场景道具：光线 / 海底 / 珊瑚 / 终端 / 声呐 / 小弟 / 浊流 / 极光 —— */
  .rays {
    position: absolute;
    left: -32%; top: -42%;
    width: 164%; height: 150%;
    background: conic-gradient(from 172deg at 50% 6%,
      transparent 0deg, rgba(150, 215, 255, 0.11) 7deg, transparent 15deg,
      transparent 26deg, rgba(150, 215, 255, 0.08) 32deg, transparent 40deg,
      transparent 55deg, rgba(150, 215, 255, 0.07) 61deg, transparent 70deg,
      transparent 86deg, rgba(150, 215, 255, 0.06) 92deg, transparent 100deg);
    animation: raysSway 9s ease-in-out infinite alternate;
    opacity: 0.8;
    transition: opacity 1s;
  }
  @keyframes raysSway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  [data-state="offline"]  .rays { opacity: 0; }
  [data-state="sleeping"] .rays { opacity: 0.45; }
  [data-state="panic"]    .rays { opacity: 0.15; }

  .seabed {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%; height: 50px;
    opacity: 0.85;
    transition: opacity 1s;
  }
  [data-state="offline"]     .seabed { opacity: 0.12; }
  [data-state="needYou"]     .seabed { opacity: 0.3; }
  [data-state="panic"]       .seabed { opacity: 0.35; }
  [data-state="celebrating"] .seabed { opacity: 0.4; }

  .coral {
    position: absolute;
    left: 6px; bottom: 26px;
    width: 74px; height: auto;
    display: none;
    filter: drop-shadow(0 0 4px rgba(255, 120, 160, 0.35));
  }
  [data-activity="coding"] .coral,
  [data-activity="cmd"]    .coral { display: block; }

  .terminal {
    position: absolute;
    left: 20px; top: 35px;
    width: 58px; height: 40px;
    padding: 3px 0 0 0;
    border-radius: 4px;
    background: rgba(3, 10, 16, 0.88);
    border: 1px solid rgba(92, 230, 168, 0.4);
    box-shadow: 0 0 10px rgba(92, 230, 168, 0.28);
    display: none;
    overflow: hidden;
  }
  /* coding：屏幕内代码行 + 光标闪烁；cmd：屏幕内 running 文字闪烁 + 屏幕晃动 */
  .terminal .code-lines { display: block; }
  .terminal .cmd-text { display: none; }
  .terminal i {
    display: block; height: 4px;
    margin: 3px 6px; border-radius: 2px;
    background: linear-gradient(90deg, #5ce6a8, rgba(92, 230, 168, 0.12));
  }
  .terminal i:nth-child(1) { width: 74%; }
  .terminal i:nth-child(2) { width: 52%; }
  .terminal i:nth-child(3) { width: 88%; }
  .terminal b {
    display: block; width: 3px; height: 8px;
    margin: 1px 6px;
    background: #5ce6a8;
    animation: blink .9s steps(1) infinite;
  }
  .terminal .cmd-text {
    display: none;
    margin: 6px 0 0 6px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    color: #5ce6a8;
    text-shadow: 0 0 6px rgba(92, 230, 168, 0.7);
  }
  @keyframes blink { 50% { opacity: 0; } }
  [data-activity="coding"] .terminal { display: block; }
  [data-activity="coding"] .terminal .code-lines { display: block; }
  [data-activity="coding"] .terminal .cmd-text { display: none; }
  [data-activity="cmd"] .terminal { display: block; animation: terminalShake .55s ease-in-out infinite; }
  [data-activity="cmd"] .terminal .code-lines { display: none; }
  [data-activity="cmd"] .terminal .cmd-text { display: block; animation: cmdFlash 1s steps(1) infinite; }
  @keyframes terminalShake {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(2px, -1px); }
    75%      { transform: translate(-2px, 1px); }
  }
  @keyframes cmdFlash { 50% { opacity: 0; } }

  /* 声呐：Canvas 绘制（绕开 CSS 动画/层叠问题，必定可见） */
  .sonar-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 50;
    pointer-events: none;
  }

  .babies { position: absolute; inset: 0; display: none; }
  .baby {
    position: absolute;
    width: 26px;
    height: 35px;
    background: var(--dsh-whale) center/contain no-repeat;
    opacity: 0.85;
    filter: drop-shadow(0 0 4px rgba(190, 220, 255, 0.3));
  }
  .baby.b1 { left: 55%; top: 28%; animation: babySwim 4.5s ease-in-out infinite; }
  .baby.b2 { left: 57%; top: 68%; animation: babySwim 4.5s ease-in-out infinite 1.4s; }
  @keyframes babySwim {
    0%, 100% { transform: translate(0, 0) rotate(-4deg); }
    50%      { transform: translate(14px, -10px) rotate(5deg); }
  }
  [data-activity="spawning"] .babies { display: block; }

  .murk { position: absolute; inset: 0; display: none; overflow: hidden; }
  .murk i {
    position: absolute; left: -25%;
    width: 150%; height: 34px;
    border-radius: 50%;
    background: rgba(18, 36, 52, 0.45);
    filter: blur(7px);
  }
  [data-state="panic"] .murk i { background: rgba(74, 26, 20, 0.5); }
  .murk i:nth-child(1) { top: 8%;  animation: murkDrift 4.6s ease-in-out infinite; }
  .murk i:nth-child(2) { top: 42%; animation: murkDrift 4.6s ease-in-out infinite 1.5s; }
  .murk i:nth-child(3) { top: 72%; animation: murkDrift 4.6s ease-in-out infinite 3s; }
  @keyframes murkDrift { 0%, 100% { transform: translateX(-6%); } 50% { transform: translateX(6%); } }
  [data-state="panic"] .murk { display: block; }

  .aurora { position: absolute; inset: 0; display: none; overflow: hidden; }
  .aurora i {
    position: absolute;
    left: 8%; right: 8%;
    height: 22px;
    border-radius: 50%;
    filter: blur(10px);
    opacity: 0.5;
    mix-blend-mode: screen;
  }
  .aurora i:nth-child(1) {
    top: 16%;
    background: linear-gradient(90deg, transparent, #2ee6c8, #4d6bfe, transparent);
    animation: auroraSway 4.5s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(2) {
    top: 30%;
    background: linear-gradient(90deg, transparent, #7b5cff, #2ee6c8, transparent);
    animation: auroraSway 5.5s ease-in-out infinite alternate-reverse;
  }
  @keyframes auroraSway {
    from { transform: translateX(-4%) rotate(-2deg); }
    to   { transform: translateX(4%) rotate(2deg); }
  }
  [data-state="celebrating"] .aurora { display: block; }

  /* —— 气泡（共享粒子池：JS 只调 --spd / --op） —— */
  .bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .bubbles i {
    position: absolute; bottom: -12px; left: var(--x);
    width: 6px; height: 6px;
    border-radius: 50%;
    border: 1px solid rgba(190, 225, 255, 0.55);
    background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.5), rgba(160, 210, 255, 0.08));
    opacity: 0;
    animation: rise var(--spd, 3s) linear infinite;
    animation-delay: var(--d, 0s);
  }
  .bubbles i:nth-child(3n)   { width: 4px; height: 4px; }
  .bubbles i:nth-child(3n+1) { width: 7px; height: 7px; }
  @keyframes rise {
    0%   { transform: translate(0, 0); opacity: 0; }
    12%  { opacity: var(--op, 0.5); }
    85%  { opacity: var(--op, 0.5); }
    100% { transform: translate(var(--dx, 4px), -152px); opacity: 0; }
  }
  /* panic：气泡 → 向上的乱流（湍急水流条，上升时左右扭曲） */
  [data-state="panic"] .bubbles i {
    width: 3px; height: 16px;
    border-radius: 2px;
    border: none;
    background: linear-gradient(rgba(190, 220, 255, 0.55), rgba(160, 210, 255, 0.05));
    animation: flowRise var(--spd, 0.9s) linear infinite;
  }
  [data-state="panic"] .bubbles i:nth-child(3n)   { width: 2px; height: 12px; }
  [data-state="panic"] .bubbles i:nth-child(3n+1) { width: 4px; height: 20px; }
  @keyframes flowRise {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-14deg); }
    15%  { opacity: 0.6; }
    50%  { opacity: 0.6; transform: translate(14px, -66px) rotate(12deg); }
    100% { opacity: 0; transform: translate(-14px, -150px) rotate(-10deg); }
  }

  /* —— ③ 鲸鱼（官方 logo path，<use> 复用；whale-pos 定位，whale 摆姿） —— */
  .whale-pos {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(0, 0);
    transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }
  .whale {
    width: var(--whale-w, 84px);
    height: calc(var(--whale-w, 84px) * 4 / 3);
    background: var(--dsh-whale) center/contain no-repeat;
    filter: drop-shadow(0 0 7px rgba(190, 220, 255, 0.35)) drop-shadow(0 0 14px rgba(190, 220, 255, 0.18));
    animation: sway 5.5s ease-in-out infinite;
  }

  /* thinking：鲸鱼头顶的加载菊花（放 whale-pos 里，跟鲸鱼游动同步） */
  .spinner {
    position: absolute;
    left: 56%; top: 24%;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    border: 3px solid rgba(160, 220, 255, 0.25);
    border-top-color: rgba(215, 238, 255, 0.95);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    display: none;
    filter: drop-shadow(0 0 5px rgba(130, 205, 255, 0.6));
  }
  [data-activity="thinking"] .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* activity 前置 */
  [data-activity="coding"]   .whale-pos { transform: translate(24px, 16px) rotate(-6deg); }
  [data-activity="cmd"]      .whale-pos { transform: translate(24px, 18px) rotate(-5deg); }
  [data-activity="search"]   .whale-pos { transform: translate(0, 8px); }
  [data-activity="spawning"] .whale-pos { transform: translate(-18px, 16px) rotate(-4deg); }
  [data-activity="thinking"] .whale-pos { animation: whaleSwim 6s ease-in-out infinite; }
  /* state 后置（覆盖 activity） */
  [data-state="offline"]     .whale-pos { transform: translate(0, 4px); }
  [data-state="offline"]     .whale {
    filter: opacity(0.55) drop-shadow(0 0 4px rgba(190, 220, 255, 0.15));
    opacity: 0.55;
  }
  [data-state="sleeping"]    .whale-pos { transform: translate(0, 20px); }
  [data-state="sleeping"]    .whale { animation: sway 8s ease-in-out infinite; opacity: 0.92; }
  [data-state="needYou"]     .whale-pos { transform: translate(0, 6px) scale(1.18); }  // 贴近窗口：居中略靠下 + 放大
  [data-state="needYou"]     .whale { animation: none; filter: drop-shadow(0 0 10px rgba(190, 220, 255, 0.5)) drop-shadow(0 0 20px rgba(190, 220, 255, 0.25)); }
  [data-state="panic"]       .whale-pos { animation: dart .6s linear infinite; }
  [data-state="panic"]       .whale { animation: none; }
  [data-state="celebrating"] .whale-pos { animation: breach 1.5s ease-in-out infinite; }
  [data-state="celebrating"] .whale { animation: none; }
  @keyframes dart {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(-9px, 5px) rotate(-5deg); }
    50%      { transform: translate(7px, -7px) rotate(4deg); }
    75%      { transform: translate(-5px, -9px) rotate(-3deg); }
  }
  /* thinking：鲸鱼左右游动 */
  @keyframes whaleSwim {
    0%, 100% { transform: translateX(-16px); }
    50%      { transform: translateX(16px); }
  }
  @keyframes breach {
    0%, 100% { transform: translate(0, 14px) rotate(0deg); }
    32%      { transform: translate(0, -26px) rotate(-9deg) scale(1.04); }
    58%      { transform: translate(0, -14px) rotate(5deg); }
    82%      { transform: translate(0, 8px) rotate(-3deg); }
  }

  /* —— ④ 前景玻璃层：高光 / 焦散 / 结雾 / 敲击震环 —— */
  .glass { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none; }
  .glint {
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.16), transparent 42%),
      radial-gradient(circle at 74% 78%, rgba(255, 255, 255, 0.05), transparent 40%);
    box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.55), inset 0 2px 8px rgba(255, 255, 255, 0.06);
  }
  .caustics {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 22% 32%, rgba(160, 220, 255, 0.16), transparent 16%),
      radial-gradient(circle at 74% 62%, rgba(160, 220, 255, 0.12), transparent 20%),
      radial-gradient(circle at 48% 18%, rgba(160, 220, 255, 0.1), transparent 12%);
    background-size: 64px 64px, 84px 84px, 56px 56px;
    animation: causticPan 16s linear infinite;
    opacity: 0.16;
    transition: opacity 1s;
  }
  @keyframes causticPan {
    from { background-position: 0 0, 0 0, 0 0; }
    to   { background-position: 64px 40px, -42px 60px, 30px -30px; }
  }
  [data-state="sleeping"] .caustics,
  [data-state="offline"]  .caustics { opacity: 0.05; }
  [data-state="needYou"]  .caustics { opacity: 0.3; }

  .fog {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 0.4s;
    background:
      radial-gradient(circle at 32% 38%, rgba(220, 240, 255, 0.18), transparent 42%),
      radial-gradient(circle at 68% 60%, rgba(220, 240, 255, 0.14), transparent 38%),
      radial-gradient(circle at 55% 25%, rgba(220, 240, 255, 0.1), transparent 30%);
    filter: blur(2px);
  }
  .pet:hover .fog { opacity: 0.6; }

  .knock {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin: -28px 0 0 -28px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.55);
    opacity: 0;
  }
  [data-state="needYou"] .knock { animation: knockRipple 0.6s ease-out infinite; }
  @keyframes knockRipple {
    0%   { transform: scale(0.35); opacity: 0.85; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  [data-state="needYou"] .viewport { animation: portholeKnock 0.5s ease-in-out infinite; }
  @keyframes portholeKnock {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(-2px, -1px); }
    75%      { transform: translate(2px, 1px); }
  }

  /* —— ① 外框层（主题化：潜艇黄铜舷窗） —— */
  .frame {
    position: absolute;
    inset: -7px;
    width: 164px; height: 164px;
    z-index: 3;
    pointer-events: none;
  }

  /* 多会话角标（浮在舷窗内的 HUD 芯片） */
  .count {
    position: absolute;
    right: 8px; bottom: 8px;
    min-width: 26px; height: 20px;
    padding: 0 8px;
    border-radius: 10px;
    background: rgba(8, 24, 40, 0.72);
    border: 1px solid rgba(140, 200, 255, 0.35);
    color: #bfe3ff;
    font-size: 12px;
    font-weight: 600;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 4;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }
  .count.show { display: flex; }

  /* ============ 深潜器控制台：标签 / 批准 / 详情 ============ */
  .label {
    font-size: 13px;
    color: #d7e6f7;
    background: rgba(6, 14, 24, 0.78);
    padding: 3px 12px;
    border-radius: 12px;
    border: 1px solid rgba(120, 180, 255, 0.18);
    max-width: 148px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  .label.offline { color: #7c8ba0; }

  .intensity { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .intensity i { width: 5px; height: 5px; border-radius: 50%; background: #27415c; }
  .intensity i.on { background: #4f9eff; }

  .actions {
    display: none;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .actions.show { display: flex; }
  .actions .ask-text {
    font-size: 11px;
    color: #ffa940;
    max-width: 158px;
    white-space: normal;
    word-break: break-all;
    text-align: center;
  }
  .actions .btn-row { display: flex; gap: 10px; width: 100%; justify-content: center; }
  .actions button {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 22px;
    min-width: 78px;
    white-space: nowrap;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .actions button:disabled { opacity: 0.45; cursor: default; }
  .actions .allow { background: #52c41a; color: #06210a; }
  .actions .allow:hover:not(:disabled) { background: #5fd424; }
  .actions .deny { background: rgba(255, 77, 79, 0.9); color: #fff; }
  .actions .deny:hover:not(:disabled) { background: #ff4d4f; }

  .close {
    position: absolute;
    top: 6px; right: 6px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 77, 79, 0.85);
    color: #fff;
    font-size: 13px;
    line-height: 22px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 5;
  }
  .card:hover .close { opacity: 1; }
  .close:hover { background: #ff4d4f; }

  .fatal {
    color: #ff4d4f;
    font-size: 12px;
    text-align: center;
    padding: 20px;
  }

  /* ============ sleeping：鲸鱼头顶缓缓飘出的 Zzz（向右上、放大、淡化） ============ */
  .zzz {
    position: absolute;
    left: 52%;
    top: 30%;
    width: 0; height: 0;
    display: none;
    pointer-events: none;
  }
  .zzz span {
    position: absolute;
    left: 0; top: 0;
    font-weight: 700;
    color: rgba(216, 236, 255, 0.92);
    text-shadow: 0 0 6px rgba(120, 180, 255, 0.55);
    opacity: 0;
    animation: zzz 3s ease-out infinite;
  }
  .zzz span:nth-child(1) { font-size: 16px; animation-delay: 0s; }
  .zzz span:nth-child(2) { font-size: 12px; animation-delay: 1s; }
  .zzz span:nth-child(3) { font-size: 9px;  animation-delay: 2s; }
  [data-state="sleeping"] .zzz { display: block; }
  @keyframes zzz {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
    25%  { opacity: 0.92; }
    100% { opacity: 0; transform: translate(22px, -34px) scale(1.7); }
  }

  /* ============ 调试模式：右键弹出的状态切换菜单 ============ */
  .debug-menu {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(4, 10, 18, 0.96);
    border: 1px solid rgba(120, 180, 255, 0.3);
    border-radius: 10px;
    padding: 6px;
    display: none;
    overflow-y: auto;
    user-select: none;
  }
  .debug-menu.open { display: block; }
  .debug-menu .dm-title {
    font-size: 11px;
    color: #7c8ba0;
    text-align: center;
    padding: 2px 0 4px;
    border-bottom: 1px solid rgba(120, 180, 255, 0.15);
    margin-bottom: 4px;
  }
  .debug-menu .dm-item {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 4px 8px;
    margin: 1px 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #d7e6f7;
    font-size: 11px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .debug-menu .dm-item:hover { background: rgba(120, 180, 255, 0.15); }
  .debug-menu .dm-item.active { background: rgba(79, 158, 255, 0.25); color: #fff; }
  .debug-menu .dm-item .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .debug-menu .dm-item.dm-live .dot { background: #52c41a; }
  .debug-menu .dm-item.dm-off .dot { background: #4b4f57; }
  .debug-menu .dm-item.dm-work .dot { background: #4f9eff; }
  .debug-menu .dm-item.dm-alert .dot { background: #ffa940; }
  .debug-menu .dm-item.dm-panic .dot { background: #ff4d4f; }
  .debug-menu .dm-item.dm-joy .dot { background: #52c41a; }
  .debug-menu .dm-item.dm-action .dot { background: #2b6cff; }
  .debug-menu .dm-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 6px; }
  .debug-menu .dm-item.dm-action { color: #8ab4ff; }
  .debug-menu .dm-item.dm-action[disabled] { opacity: 0.4; cursor: not-allowed; }
</style>

<script>
(function () {

  const win = T.window.getCurrentWindow()

  // 窗口高度：待批准时加高以在舷窗下方显示审批区；只 setSize（顶不动），不改位置
  const HEIGHT_BASE = 210
  const HEIGHT_APPROVE = 330
  function applyHeight(h) {
    win.setSize(new T.window.LogicalSize(178, h)).catch(() => {})
  }

  const ACTIVITY_LABEL = {
    idle: '闲置', thinking: '思考中…', coding: '写代码',
    cmd: '跑命令', search: '查资料', spawning: '召唤小弟', waiting: '等你输入',
  }

  const $ = (id) => document.getElementById(id)
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

  let state = null
  let online = false
  let curPort = null
  let ws = null             // 当前 WebSocket（answerApproval 也要用，必须在 IIFE 顶层）
  let hostVersion = null    // 握手响应里的 hostVersion（v1.1 起提供；null = 旧版）
  let pendingAsk = null    // { askId, toolName, reason } — 服务端 approval/asked
  let askAnswered = false  // 已点过按钮，等服务端 settled
  let discoverErr = null   // discover_port 失败时的错误文本（显示在标签上，便于无控制台诊断）
  let debugMode = null     // 调试模式锁定：{ state, activity, intensity } 或 null（真实模式）
  let petConfig = null     // whalebuddy 配置（来自 state/config 消息）：{ autostart, skin }
  let lastAutostart = null // 上次应用过的 autostart（null=首次，首次也要应用一次做幂等同步）

  // whalebuddy 配置应用：皮肤换 CSS 变量（data-skin 属性）、autostart 调 Rust 写/删 Run 键。
  // 值变化时动作；首次收到 config（连接握手/宠物重启）也应用一次——幂等写保证
  // 注册表与 settings 一致（settings=false 时清残留键；settings=true 时确保存在）。
  function applyConfig(cfg) {
    if (!cfg || typeof cfg !== 'object') return
    const skin = typeof cfg.skin === 'string' && cfg.skin ? cfg.skin : 'dsh-black-whale'
    document.documentElement.dataset.skin = skin
    petConfig = { autostart: cfg.autostart === true, skin }
    if (petConfig.autostart !== lastAutostart) {
      lastAutostart = petConfig.autostart
      try {
        invoke('set_autostart', { enabled: petConfig.autostart })
          .then(() => { try { invoke('debug_log', { msg: 'autostart applied: ' + petConfig.autostart }) } catch (e) {} })
          .catch((e) => { try { invoke('debug_log', { msg: 'autostart failed: ' + String((e && e.message) || e) }) } catch (e2) {} })
      } catch (e) { /* invoke 不可用（纯浏览器调试）时忽略 */ }
    }
  }

  function deriveState(s) {
    if (!s || !online) return 'offline'
    if (s.awaitingApproval?.pending) return 'needYou'
    if (s.pulse?.kind === 'panic') return 'panic'
    if (s.pulse?.kind === 'celebrating') return 'celebrating'
    if (s.session?.status === 'running') return 'working'
    return 'sleeping'
  }
  function deriveActivity(s) {
    if (!s || s.session?.status !== 'running') return 'idle'
    return s.activity || 'thinking'
  }

  // 气泡速率：按 (状态, 活动, 思考强度) 调共享粒子池的两个 CSS 变量
  // ============ 声呐（Canvas 绘制扩散圆环，search 状态显示） ============
  const sonarCanvas = $('sonar-canvas')
  const sctx = sonarCanvas && sonarCanvas.getContext('2d')
  let sonarRAF = null
  let sonarT0 = 0
  function sizeSonar() {
    if (!sonarCanvas || !sctx) return
    const dpr = window.devicePixelRatio || 1
    sonarCanvas.width = 150 * dpr
    sonarCanvas.height = 150 * dpr
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }
  function drawSonar(now) {
    sctx.clearRect(0, 0, 150, 150)
    const t = now - sonarT0
    const cx = 92, cy = 62   // 鲸鱼头部附近（search 时鲸鱼下移，头在舷窗中上偏右）
    const period = 2400
    for (let k = 0; k < 3; k++) {
      const ph = ((t % period) / period + k / 3) % 1
      const r = 10 + ph * 55
      const op = (1 - ph) * 0.7
      sctx.beginPath()
      sctx.arc(cx, cy, r, 0, Math.PI * 2)
      sctx.strokeStyle = 'rgba(140, 210, 255, ' + op.toFixed(2) + ')'
      sctx.lineWidth = 2.5
      sctx.shadowColor = 'rgba(140, 210, 255, 0.9)'
      sctx.shadowBlur = 10
      sctx.stroke()
      sctx.shadowBlur = 0
    }
    sonarRAF = requestAnimationFrame(drawSonar)
  }
  function startSonar() {
    if (!sctx || sonarRAF) return
    sonarT0 = performance.now()
    sonarRAF = requestAnimationFrame(drawSonar)
  }
  function stopSonar() {
    if (sonarRAF) { cancelAnimationFrame(sonarRAF); sonarRAF = null }
    if (sctx) sctx.clearRect(0, 0, 150, 150)
  }
  sizeSonar()

  function bubbleParams(st, act, n) {
    switch (st) {
      case 'offline':     return { spd: 9,  op: 0.16 }
      case 'sleeping':    return { spd: 6,  op: 0.34 }
      case 'needYou':     return { spd: 1.7, op: 0.8 }
      case 'panic':       return { spd: 0.9, op: 0.6 }
      case 'celebrating': return { spd: 1.9, op: 0.75 }
    }
    if (act === 'thinking') return { spd: Math.max(1.2, 3.4 - n * 0.55), op: 0.5 + n * 0.12 }
    if (act === 'search')   return { spd: 2.2, op: 0.55 }
    return { spd: 2.6, op: 0.5 }
  }

  function render() {
    // 调试模式优先：debugMode 非 null 时锁定状态/活动/强度
    const st = debugMode ? debugMode.state : deriveState(state)
    const act = debugMode ? debugMode.activity : deriveActivity(state)
    const n = debugMode ? debugMode.intensity : (state?.activityIntensity ?? 0)
    const pet = $('pet')
    pet.dataset.state = st
    pet.dataset.activity = act
    pet.dataset.intensity = String(n)

    const bp = bubbleParams(st, act, n)
    const bub = $('bubbles')
    bub.style.setProperty('--spd', bp.spd + 's')
    bub.style.setProperty('--op', String(bp.op))

    // 声呐：search 时用 Canvas 绘制扩散圆环（不依赖 CSS 动画，必定可见）
    if (act === 'search') startSonar(); else stopSonar()

    // 批准态切换：.card 加 .approving（CSS 控制 actions 显示）+ 窗口加高容纳舷窗下方的审批区
    const approving = !!pendingAsk
    if (card.classList.contains('approving') !== approving) {
      card.classList.toggle('approving', approving)
    }
    applyHeight(approving ? HEIGHT_APPROVE : HEIGHT_BASE)

    // 标签：待批准优先；working 显示活动名 + 强度点；其余显示状态词
    const lbl = $('label')
    const acts = $('actions')
    if (pendingAsk) {
      lbl.className = 'label'
      lbl.textContent = '⏳ 待批准'
      acts.classList.add('show')
      $('ask-text').textContent = (pendingAsk.toolName || '?') + (pendingAsk.reason ? '：' + (pendingAsk.reason.length > 40 ? pendingAsk.reason.slice(0, 40) + '…' : pendingAsk.reason) : '')
      $('btn-allow').disabled = askAnswered
      $('btn-deny').disabled = askAnswered
    } else {
      acts.classList.remove('show')
      if (debugMode) {
        // 调试模式：标签显示锁定的状态/活动
        lbl.className = 'label'
        const dn = debugMode.activity === 'thinking' ? ('思考' + debugMode.intensity) : (ACTIVITY_LABEL[debugMode.activity] || debugMode.activity)
        lbl.textContent = '🔧 ' + (debugMode.state === 'working' ? dn : debugMode.state)
      } else if (st === 'working') {
        lbl.className = 'label'
        lbl.innerHTML = (ACTIVITY_LABEL[act] || act) +
          '<span class="intensity">' + [0,1,2,3].map((i) => '<i class="' + (i < n ? 'on' : '') + '"></i>').join('') + '</span>'
      } else {
        lbl.className = 'label' + (st === 'offline' ? ' offline' : '')
        lbl.textContent = st === 'offline'
          ? (discoverErr ? '发现异常: ' + discoverErr
            : online ? '断线重连中…' : '找 DSH 中…')
          : st === 'sleeping' ? '睡着了 😴'
          : st === 'needYou' ? '需要你！'
          : st === 'panic' ? '出错了！'
          : st === 'celebrating' ? '搞定啦！'
          : st
      }
    }

    // 多会话角标
    const running = state?.sessions?.running ?? 0
    const c = $('count')
    if (running > 1) { c.textContent = '×' + running; c.classList.add('show') }
    else c.classList.remove('show')
  }

  function handleMsg(raw) {
    try {
      const msg = JSON.parse(raw)
      if (msg.type === 'state') {
        state = msg
        applyConfig(msg.config) // state 快照内嵌 config（含皮肤/自启动）
        render()
      } else if (msg.type === 'config') {
        applyConfig(msg.config) // 设置变更即时推送
      } else if (msg.type === 'approval/asked') {
        // v1 单待批显示：并发多批时显示最新（服务端按 askId 各自结算/回退，不会卡死）
        pendingAsk = { askId: msg.askId, toolName: msg.toolName, reason: msg.reason }
        askAnswered = false
        render()
      } else if (msg.type === 'approval/settled') {
        if (pendingAsk && msg.askId === pendingAsk.askId) {
          pendingAsk = null
          askAnswered = false
          render()
        }
      }
      // ping 忽略；协议预留
    } catch (e) { /* 忽略坏帧 */ }
  }

  async function ensureLoop() {
    for (;;) {
      online = false
      curPort = null
      render()

      let port = null
      // 上次成功的端口作为 hint 先验证（直连一次，免全段扫描）
      let hint = null
      try { const n = Number(localStorage.getItem('petPort')); if (Number.isInteger(n) && n > 0) hint = n } catch (e) {}
      try { port = await invoke('discover_port', { portHint: hint }); discoverErr = null } catch (e) { discoverErr = String((e && e.message) || e); render() }

      if (port) {
        curPort = port
        await new Promise((resolve) => {
          try { ws = new WebSocket('ws://127.0.0.1:' + port + '/dsh-pet/ws') }
          catch (e) { resolve(); return }
          ws.onopen = () => {
            online = true; render()
            try { localStorage.setItem('petPort', String(port)) } catch (e) { /* 缓存尽力而为 */ }
            // 版本探测（handshake 带 ACAO:*，可跨源）：v1.1 起显示 host 版本，旧版静默
            fetch('http://127.0.0.1:' + port + '/dsh-pet/handshake')
              .then((r) => r.json())
              .then((j) => { hostVersion = j.hostVersion || null; render() })
              .catch(() => {})
          }
          ws.onmessage = (ev) => handleMsg(ev.data)
          ws.onclose = () => {
            ws = null
            hostVersion = null
            // 断开即弃待批：服务端检测到全断开会自动把请求交回 GUI 卡片，不会卡死
            pendingAsk = null
            askAnswered = false
            resolve()
          }
          ws.onerror = () => { /* close 会跟着来 */ }
        })
        // 连上后断开：DSH 可能重启换了端口 → 短暂等待后重新发现
        await sleep(3000)
      } else {
        // 没找到端点：等 8s 再扫（插件没装 / DSH 没开）
        await sleep(8000)
      }
    }
  }

  // ---- 窗口行为 ----
  $('close').addEventListener('click', async () => {
    try { await win.destroy() } catch (e) { window.close() }
  })

  // ---- 批准应答 ----
  function answerApproval(outcome) {
    if (!pendingAsk) return
    // 调试 mock 审批：不发给服务端，直接模拟清除
    if (pendingAsk.askId === 'debug') {
      pendingAsk = null
      askAnswered = false
      render()
      return
    }
    if (!ws || ws.readyState !== 1) return
    askAnswered = true
    render()
    try {
      ws.send(JSON.stringify({ type: 'approval/respond', protocolVersion: 1, askId: pendingAsk.askId, outcome }))
    } catch (e) {
      askAnswered = false
      render()
    }
  }
  $('btn-allow').addEventListener('click', () => answerApproval('allowed-once'))
  $('btn-deny').addEventListener('click', () => answerApproval('rejected'))

  // 拖拽：显式调用 startDragging（drag-region 属性会被子元素命中拦截，不可靠）
  $('pet').addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return
    if (ev.target.closest('.close')) return
    if (ev.target.closest('.debug-menu')) return
    win.startDragging().catch(() => {})
  })

  // ============ 调试模式：右键宠物弹出状态菜单 ============
  const dmMenu = $('debug-menu')
  // 解析菜单项 data-debug → 调试锁定值
  const DEBUG_VALUES = {
    'live': null,
    'offline': { state: 'offline', activity: 'idle', intensity: 0 },
    'sleeping': { state: 'sleeping', activity: 'idle', intensity: 0 },
    'needYou': { state: 'needYou', activity: 'idle', intensity: 0 },
    'panic': { state: 'panic', activity: 'idle', intensity: 0 },
    'celebrating': { state: 'celebrating', activity: 'idle', intensity: 0 },
    'working-thinking': { state: 'working', activity: 'thinking', intensity: 2 },
    'working-coding': { state: 'working', activity: 'coding', intensity: 0 },
    'working-cmd': { state: 'working', activity: 'cmd', intensity: 0 },
    'working-search': { state: 'working', activity: 'search', intensity: 0 },
    'working-spawning': { state: 'working', activity: 'spawning', intensity: 0 },
  }
  function openDebugMenu() {
    dmMenu.classList.add('open')
    // 高亮当前锁定项
    const cur = debugMode ? (debugMode.state === 'working'
      ? 'working-' + debugMode.activity + (debugMode.activity === 'thinking' ? debugMode.intensity : '')
      : debugMode.state) : 'live'
    dmMenu.querySelectorAll('.dm-item').forEach((it) => {
      it.classList.toggle('active', it.dataset.debug === cur)
    })
    // whalebuddy 设置入口：未连 DSH 时禁用
    dmMenu.querySelectorAll('[data-action="open-config"]').forEach((it) => {
      it.toggleAttribute('disabled', !curPort)
    })
  }
  function closeDebugMenu() {
    dmMenu.classList.remove('open')
  }
  // 右键宠物弹出菜单（contextmenu 不用于拖拽）
  $('pet').addEventListener('contextmenu', (ev) => {
    ev.preventDefault()
    openDebugMenu()
  })
  // 点击菜单项：先处理 action（whalebuddy 设置入口），再切换调试锁定
  dmMenu.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.dm-item')
    if (!btn) return
    if (btn.dataset.action === 'open-config') {
      if (!curPort) {
        try { invoke('debug_log', { msg: 'open-config blocked: not connected' }) } catch (e) {}
        closeDebugMenu()
        return
      }
      const url = 'http://127.0.0.1:' + curPort + '/dsh-pet/config'
      try {
        invoke('open_url', { url })
          .then(() => { try { invoke('debug_log', { msg: 'opened config: ' + url }) } catch (e) {} })
          .catch((e) => { try { invoke('debug_log', { msg: 'open_url failed: ' + String((e && e.message) || e) }) } catch (e2) {} })
      } catch (e) { /* invoke 不可用 */ }
      closeDebugMenu()
      return
    }
    const key = btn.dataset.debug
    if (key === undefined) return
    debugMode = DEBUG_VALUES[key]
    // needYou 需要模拟一个待批准请求，才能看到审批区/按钮
    if (key === 'needYou') {
      pendingAsk = { askId: 'debug', toolName: 'escalate sandbox', reason: '请求提升沙箱权限执行命令' }
      askAnswered = false
    } else if (pendingAsk && pendingAsk.askId === 'debug') {
      pendingAsk = null
      askAnswered = false
    }
    closeDebugMenu()
    render()
  })
  // 点击菜单外（宠物本体空白区）关闭菜单
  document.addEventListener('click', (ev) => {
    if (dmMenu.classList.contains('open') && !ev.target.closest('.debug-menu')) {
      closeDebugMenu()
    }
  })

  // 位置记忆（物理像素）——只在窗口回到基准尺寸时保存，避免坏值
  let saveTimer = null
  win.onMoved(({ payload }) => {
    clearTimeout(saveTimer)
    saveTimer = setTimeout(() => {
      try { localStorage.setItem('petPos', JSON.stringify({ x: payload.x, y: payload.y })) } catch (e) {}
    }, 500)
  })
  ;(async () => {
    try {
      const pos = JSON.parse(localStorage.getItem('petPos') || 'null')
      if (pos && Number.isFinite(pos.x) && Number.isFinite(pos.y)) {
        // 校验位置在屏幕内
        let ok = true
        try {
          const mon = await win.currentMonitor()
          if (mon && mon.size) {
            if (pos.x < -50 || pos.y < -50 ||
                pos.x > mon.size.width + 50 || pos.y > mon.size.height + 50) ok = false
          }
        } catch (e) {}
        if (ok) await win.setPosition(new T.window.PhysicalPosition(pos.x, pos.y))
      }
    } catch (e) {}
  })()

  render()
  ensureLoop()
})()
</script>
</body>
</html>
