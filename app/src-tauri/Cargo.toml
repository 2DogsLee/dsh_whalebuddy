[package]
name = "dsh-pet"
version = "0.1.0"
description = "DeepSeek Harness 桌面宠物"
edition = "2021"

[lib]
name = "dsh_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
